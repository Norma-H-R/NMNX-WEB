<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="用户头像">
  <defs>
    <radialGradient id="av-bg" cx="34%" cy="26%" r="88%">
      <stop offset="0" stop-color="#16204a" />
      <stop offset="52%" stop-color="#0a0e1f" />
      <stop offset="1" stop-color="#04050a" />
    </radialGradient>
    <linearGradient id="av-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="av-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity=".34" />
      <stop offset="1" stop-color="#6ee7ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="128" height="128" fill="url(#av-bg)" />

  <!-- 细网格：放大了才看得见，缩到头像尺寸只是一层极淡的底纹 -->
  <g stroke="#6ee7ff" stroke-opacity=".1" stroke-width="1">
    <path d="M0 32h128M0 64h128M0 96h128M32 0v128M64 0v128M96 0v128" />
  </g>

  <circle cx="64" cy="60" r="52" fill="url(#av-halo)" />

  <!-- 品牌四角星 -->
  <path
    d="M64 30c3 24 8.5 29.5 32.5 32.5-24 3-29.5 8.5-32.5 32.5-3-24-8.5-29.5-32.5-32.5 24-3 29.5-8.5 32.5-32.5Z"
    fill="url(#av-star)"
  />

  <circle cx="98" cy="30" r="2.6" fill="#6ee7ff" opacity=".62" />
  <circle cx="30" cy="98" r="1.9" fill="#a78bfa" opacity=".55" />
</svg>
